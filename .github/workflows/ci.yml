name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install system binaries
        run: sudo apt-get update && sudo apt-get install -y ghostscript tesseract-ocr tesseract-ocr-por libreoffice
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install project
        run: uv pip install --system -e ".[cli,api,dev,render,images,ocr,tables,sign,office]"
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest
