[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdftoolkit"
version = "0.2.0"
description = "Concentrador de operações de PDF: um núcleo Python com adaptadores de CLI e API."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Davi Moreira" }]
keywords = ["pdf", "merge", "split", "rotate", "watermark", "toolkit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf[crypto]>=4.2",
    "pikepdf>=8.0",
    "pydantic>=2.6",
    "reportlab>=4.0",
]

[project.optional-dependencies]
cli = ["click>=8.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
render = ["pymupdf>=1.24"]      # AGPL — opcional, fora do núcleo
images = ["pillow>=10.0"]        # opcional — imagens -> PDF
ocr = ["ocrmypdf>=16.0"]         # opcional — requer tesseract no sistema
tables = ["pdfplumber>=0.11"]    # opcional
sign = ["pyhanko>=0.20"]         # opcional — assinatura digital
office = ["pdf2docx>=0.5"]       # opcional — PDF->Word; Office->PDF requer soffice
qr = ["qrcode[pil]>=7.0"]        # opcional — geração de QR code
xlsx = ["openpyxl>=3.1"]         # opcional — tabelas -> planilha
html = ["weasyprint>=60.0"]      # opcional — HTML -> PDF (BSD)
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
ptk = "pdftoolkit.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pdftoolkit"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# FastAPI usa File()/Form() como defaults (padrão do framework, não é bug).
"src/pdftoolkit/api/app.py" = ["B008"]

[tool.mypy]
# Semântica 3.12 evita falha de parse em stubs de dependências transitivas (numpy);
# o runtime continua suportando 3.11+ e o ruff valida a sintaxe-alvo py311.
python_version = "3.12"
packages = ["pdftoolkit"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pikepdf.*",
    "reportlab.*",
    "pypdf.*",
    "fitz",
    "fitz.*",
    "ocrmypdf",
    "ocrmypdf.*",
    "pdfplumber",
    "pdfplumber.*",
    "PIL.*",
    "pdf2docx",
    "pdf2docx.*",
    "pyhanko.*",
    "qrcode",
    "qrcode.*",
    "openpyxl",
    "openpyxl.*",
    "weasyprint",
    "weasyprint.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
